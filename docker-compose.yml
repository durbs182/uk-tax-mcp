# docker-compose.yml — local development and smoke-testing
#
# Runs the production HTTP API (api.py) on port 8000 using the `dev`
# Dockerfile stage, which adds FastAPI + uvicorn on top of the production image.
#
# Usage:
#   docker compose up --build
#   curl http://localhost:8000/health
#   curl http://localhost:8000/v1/rules | jq .
#   curl -s -X POST http://localhost:8000/v1/rules/<rule_id>/execute \
#     -H 'Content-Type: application/json' \
#     -d '{"inputs":{}}' | jq .

services:
  uk-tax-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: uk-tax-mcp-dev
      LOG_LEVEL: DEBUG
      LOG_FORMAT: text
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
