name: Rule Validation

on:
  pull_request:
    branches: [main]
    # No paths filter — validate-rules must always run so GitHub can post a
    # check result. PRs with no rule changes pass immediately with no noise.

concurrency:
  group: rule-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rules:
    name: validate-rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # needed to post PR comment

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # full history so we can diff against the base branch

      - name: Detect changed rule files
        id: changed
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD \
            -- 'src/hmrc_tax_mcp/registry/rules/**/*.yaml' \
            | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -n "$files" ]; then
            echo "HAS_RULES=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: env.HAS_RULES == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: env.HAS_RULES == 'true'
        run: pip install -e ".[dev,server,http]"

      - name: Run stage 1–5 validation
        if: env.HAS_RULES == 'true'
        # Exit code 1 means one or more rules failed stages 1–5.
        # We capture the report for the PR comment regardless of outcome.
        run: |
          python scripts/validate_changed_rules.py ${{ steps.changed.outputs.files }} \
            > report.md || echo "VALIDATION_FAILED=1" >> "$GITHUB_ENV"

      - name: Post validation report as PR comment
        if: env.HAS_RULES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/post_pr_comment.py \
            "${{ github.event.pull_request.number }}" \
            "${{ github.run_id }}" \
            < report.md

      - name: Fail if any rule failed stages 1–5
        if: env.VALIDATION_FAILED == '1'
        run: |
          echo "::error::One or more rule files failed stages 1–5. See the PR comment for details."
          exit 1
