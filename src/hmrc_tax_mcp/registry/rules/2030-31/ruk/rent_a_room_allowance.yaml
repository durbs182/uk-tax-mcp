rule_id: rent_a_room_allowance
version: "2.0.0"
tax_year: "2030-31"
jurisdiction: "rUK"
title: "Rent-a-Room Allowance"
description: >
  Returns the rent-a-room exempt amount for the tax year. The full exempt amount is £7,500
  where only one person lets accommodation in the property. If another person also lets
  accommodation in the same residence at any time during the 12-month period, the exempt
  amount is halved to £3,750 (ITTOIA 2005 s.796). Input variable `shared_letting` is a
  boolean: true if another person also lets accommodation in the same property during the period.
dsl_source: |
  return if shared_letting then 3750 else 7500
ast:
  node: IF
  cond:
    node: VAR
    name: shared_letting
  then:
    node: CONST
    value: 3750
  else:
    node: CONST
    value: 7500
