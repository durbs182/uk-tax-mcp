rule_id: income_tax_due
version: 1.0.0
tax_year: 2027-28
jurisdiction: scotland
title: Income Tax Due – Composite (Scotland 2027-28)
description: 'Calculates income tax on employment/trading income (non-savings, non-dividend) for a Scottish taxpayer in 2027-28,
  combining the personal allowance taper and the six Scottish rate bands. The Scottish bands are projected frozen at 2026-27
  levels. Property income, savings, and dividends are taxed separately at UK rates — those rules are the UK-wide ones already
  copied for Scotland. The personal allowance (£12,570) tapers by £1 per £2 above £100,000, reaching £0 at £125,140. Result
  is rounded to the nearest penny. Input variable `adjusted_net_income` is gross taxable income before the personal allowance.

  '
dsl_source: "let effective_pa = taper adjusted_net_income:\n  threshold 100000\n  ratio 1 per 2\n  base 12570\nlet starter_income\
  \ = max(min(adjusted_net_income, 16537) - effective_pa, 0)\nlet basic_income = max(min(adjusted_net_income, 29526) - max(effective_pa,\
  \ 16537), 0)\nlet intermediate_income = max(min(adjusted_net_income, 43662) - max(effective_pa, 29526), 0)\nlet higher_income\
  \ = max(min(adjusted_net_income, 75000) - max(effective_pa, 43662), 0)\nlet advanced_income = max(min(adjusted_net_income,\
  \ 125140) - max(effective_pa, 75000), 0)\nlet top_income = max(adjusted_net_income - 125140, 0)\nreturn round(starter_income\
  \ * 0.19 + basic_income * 0.20 + intermediate_income * 0.21 + higher_income * 0.42 + advanced_income * 0.45 + top_income\
  \ * 0.48, 2)\n"
