rule_id: pa_taper
version: 1.0.0
tax_year: 2027-28
jurisdiction: scotland
title: Personal Allowance Taper (Scotland 2026-27)
description: 'Tapers the personal allowance (£12,570) for Scottish taxpayers with high adjusted net income. The taper is set
  by UK legislation and applies equally to Scotland: for every £2 of adjusted net income above £100,000 the allowance is reduced
  by £1. The allowance reaches zero at £125,140. Input variable `adjusted_net_income` is defined in ITTOIA 2005 s.58.

  '
dsl_source: "taper adjusted_net_income:\n  threshold 100000\n  ratio 1 per 2\n  base 12570\n"
