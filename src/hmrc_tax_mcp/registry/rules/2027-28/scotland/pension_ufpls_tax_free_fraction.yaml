title: Pension UFPLS Tax-Free Fraction (Scotland 2026-27)
description: 'For an Uncrystallised Funds Pension Lump Sum (UFPLS), 25% of each payment is tax-free (up to the Lump Sum Allowance
  remaining). This rule returns the tax-free fraction as a decimal (0.25). Multiply by the UFPLS amount to obtain the tax-free
  portion.

  '
dsl_source: 'return 0.25

  '
