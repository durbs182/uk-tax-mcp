rule_id: is_higher_rate_taxpayer
version: 1.0.0
tax_year: 2026-27
jurisdiction: scotland
title: Higher-Rate Taxpayer Test (Scotland 2026-27)
description: 'Returns true if the individual''s adjusted net income exceeds the Scottish higher-rate threshold of £43,662.
  In Scotland the higher rate (42%) starts at £43,662 — lower than the rUK threshold of £50,270. Used to determine which Personal
  Savings Allowance tier applies (Scottish higher/advanced/top rate taxpayers receive £500; basic/starter-rate taxpayers receive
  £1,000). Input variable `adjusted_net_income` is gross income before the personal allowance deduction (as used in ITTOIA
  2005 s.58).

  '
dsl_source: 'return adjusted_net_income > 43662

  '
